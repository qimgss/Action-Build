name: 上传Artifacts到Release

on:
  workflow_dispatch:
    inputs:
      workflow_name:
        description: '要上传的工作流名称'
        required: true
        type: string
      include_failed_cancelled:
        description: '是否包含失败/取消的工作流（勾选=包含，不勾选=仅成功）'
        required: false
        default: false
        type: boolean
      artifact_count:
        description: '最近运行的工作流数量（包括失败/取消的）'
        required: false
        default: '1'
        type: string
      branch_name:
        description: '分支名称（可选）'
        required: false
        type: string
      release_title:
        description: 'Release标题'
        required: true
        type: string
      release_body:
        description: 'Release描述（支持多行，使用 \n 换行）'
        required: true
        type: string
      release_tag:
        description: 'Tag名称'
        required: true
        type: string
  workflow_call:
    inputs:
      workflow_name:
        description: '要上传的工作流名称'
        required: true
        type: string
      include_failed_cancelled:
        description: '是否包含失败/取消的工作流（勾选=包含，不勾选=仅成功）'
        required: false
        default: false
        type: boolean
      artifact_count:
        description: '最近运行的工作流数量（包括失败/取消的）'
        required: false
        default: '1'
        type: string
      branch_name:
        description: '分支名称'
        required: true
        type: string
      release_title:
        description: 'Release标题'
        required: true
        type: string
      release_body:
        description: 'Release描述（支持多行，使用 \n 换行）'
        required: true
        type: string
      release_tag:
        description: 'Tag名称'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  process-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup variables
        id: vars
        run: |
          # 确定分支名
          if [ -n "${{ inputs.branch_name }}" ]; then
            BRANCH="${{ inputs.branch_name }}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          
      - name: Prepare release body (handle multiline)
        id: prepare_body
        env:
          RAW_BODY: ${{ inputs.release_body }}
        run: |
          # 将 \n 替换为真正的换行符，并写入临时文件
          echo -e "$RAW_BODY" > /tmp/release_body.txt
          echo "Body written to temp file"
          
      - name: Create Release via API
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ inputs.release_tag }}"
          RELEASE_TITLE="${{ inputs.release_title }}"
          
          # 读取多行body内容并转义为JSON字符串
          BODY_CONTENT=$(cat /tmp/release_body.txt | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
          
          echo "Creating release with tag: $TAG_NAME"
          
          # 创建 Release（使用临时文件传递body避免shell转义问题）
          python3 -c "
            import json, urllib.request, os

            token = os.environ['GH_TOKEN']
            repo = '${{ github.repository }}'
            tag = '$TAG_NAME'
            title = '$RELEASE_TITLE'

            with open('/tmp/release_body.txt', 'r') as f:
                body = f.read()

            data = {
                'tag_name': tag,
                'target_commitish': '${{ github.sha }}',
                'name': title,
                'body': body,
                'draft': False,
                'prerelease': False
            }

            req = urllib.request.Request(
                f'https://api.github.com/repos/{repo}/releases',
                data=json.dumps(data).encode(),
                headers={
                    'Accept': 'application/vnd.github+json',
                    'Authorization': f'Bearer {token}',
                    'Content-Type': 'application/json'
                },
                method='POST'
            )

            resp = urllib.request.urlopen(req)
            result = json.loads(resp.read())
            print(f'release_id={result[\"id\"]}')
            print(f'Created release ID: {result[\"id\"]}')
          " >> $GITHUB_OUTPUT
          
      - name: Get workflow runs
        id: workflow_runs
        uses: actions/github-script@v7
        with:
          script: |
            const { workflow_name, artifact_count, include_failed_cancelled } = context.payload.inputs;
            const count = parseInt(artifact_count) || 1;
            
            // 查找工作流
            const workflows = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            const targetWorkflow = workflows.data.workflows.find(
              w => w.name === workflow_name
            );
            
            if (!targetWorkflow) {
              core.setFailed(`Workflow "${workflow_name}" not found`);
              return [];
            }
            
            // 构建请求参数
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: targetWorkflow.id,
              per_page: count
            };
            
            // 如果不包含失败/取消，只获取成功的
            if (include_failed_cancelled !== 'true') {
              params.status = 'success';
            }
            
            // 获取工作流运行记录
            const runs = await github.rest.actions.listWorkflowRuns(params);
            
            const runData = runs.data.workflow_runs.map(run => ({
              id: run.id,
              run_number: run.run_number,
              conclusion: run.conclusion,
              status: run.status,
              created_at: run.created_at
            }));
            
            console.log(`Found ${runData.length} workflow runs`);
            runData.forEach(run => {
              console.log(`  Run #${run.run_number}: ${run.conclusion || run.status}`);
            });
            
            core.setOutput('runs', JSON.stringify(runData));
            return runData;
            
      - name: Download, extract and upload artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.create_release.outputs.release_id }}
        run: |
          RUNS_JSON='${{ steps.workflow_runs.outputs.runs }}'
          RUNS=$(echo "$RUNS_JSON" | jq -c '.[]')
          
          echo "$RUNS" | while read -r RUN; do
            RUN_ID=$(echo "$RUN" | jq -r '.id')
            RUN_NUMBER=$(echo "$RUN" | jq -r '.run_number')
            CONCLUSION=$(echo "$RUN" | jq -r '.conclusion')
            STATUS=$(echo "$RUN" | jq -r '.status')
            
            echo "Processing workflow run #$RUN_NUMBER (ID: $RUN_ID) - Status: $CONCLUSION/$STATUS"
            
            # 获取该运行的artifacts列表
            ARTIFACTS_RESPONSE=$(curl -s \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts")
            
            ARTIFACT_COUNT=$(echo "$ARTIFACTS_RESPONSE" | jq '.total_count')
            echo "  Found $ARTIFACT_COUNT artifacts"
            
            if [ "$ARTIFACT_COUNT" -gt 0 ]; then
              ARTIFACTS=$(echo "$ARTIFACTS_RESPONSE" | jq -c '.artifacts[]')
              
              echo "$ARTIFACTS" | while read -r ARTIFACT; do
                ARTIFACT_ID=$(echo "$ARTIFACT" | jq -r '.id')
                ARTIFACT_NAME=$(echo "$ARTIFACT" | jq -r '.name')
                DOWNLOAD_URL=$(echo "$ARTIFACT" | jq -r '.archive_download_url')
                
                echo "  Downloading artifact: $ARTIFACT_NAME (ID: $ARTIFACT_ID)"
                
                # 创建临时目录
                TMP_DIR="/tmp/extract_${ARTIFACT_NAME}_run${RUN_NUMBER}"
                mkdir -p "$TMP_DIR"
                
                # 下载artifact zip
                curl -s -L \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -o "/tmp/${ARTIFACT_NAME}_run${RUN_NUMBER}.zip" \
                  "$DOWNLOAD_URL"
                
                # 检查文件大小
                FILE_SIZE=$(stat -c%s "/tmp/${ARTIFACT_NAME}_run${RUN_NUMBER}.zip" 2>/dev/null || stat -f%z "/tmp/${ARTIFACT_NAME}_run${RUN_NUMBER}.zip" 2>/dev/null)
                echo "  Downloaded zip size: $FILE_SIZE bytes"
                
                if [ "$FILE_SIZE" -gt 0 ]; then
                  # 解压zip到临时目录
                  echo "  Extracting zip..."
                  unzip -o "/tmp/${ARTIFACT_NAME}_run${RUN_NUMBER}.zip" -d "$TMP_DIR"
                  
                  # 遍历解压后的文件并逐个上传
                  find "$TMP_DIR" -type f | while read -r FILE_PATH; do
                    RELATIVE_PATH="${FILE_PATH#$TMP_DIR/}"
                    
                    # 保持目录结构作为文件名前缀
                    FLAT_NAME=$(echo "$RELATIVE_PATH" | tr '/' '_')
                    ASSET_NAME="${ARTIFACT_NAME}_run${RUN_NUMBER}_${FLAT_NAME}"
                    
                    echo "  Uploading file: $RELATIVE_PATH as $ASSET_NAME"
                    
                    UPLOAD_RESPONSE=$(curl -s -X POST \
                      -H "Accept: application/vnd.github+json" \
                      -H "Authorization: Bearer $GH_TOKEN" \
                      -H "Content-Type: application/octet-stream" \
                      --data-binary @"$FILE_PATH" \
                      "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=${ASSET_NAME}")
                    
                    UPLOAD_STATUS=$(echo "$UPLOAD_RESPONSE" | jq -r '.state // .message // "unknown"')
                    echo "    Upload status: $UPLOAD_STATUS"
                  done
                  
                  # 清理临时文件和目录
                  rm -rf "$TMP_DIR"
                  rm -f "/tmp/${ARTIFACT_NAME}_run${RUN_NUMBER}.zip"
                else
                  echo "  Warning: Downloaded file is empty, skipping"
                fi
              done
            else
              echo "  No artifacts found for this run"
            fi
          done
          
      - name: Verify release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID=${{ steps.create_release.outputs.release_id }}
          
          # 验证release是否创建成功
          RELEASE_INFO=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}")
          
          RELEASE_NAME=$(echo "$RELEASE_INFO" | jq -r '.name')
          ASSETS_COUNT=$(echo "$RELEASE_INFO" | jq '.assets | length')
          
          echo "✅ Release created successfully!"
          echo "📦 Release Title: $RELEASE_NAME"
          echo "🎯 Assets uploaded: $ASSETS_COUNT"
          
          # 列出所有上传的资产
          echo ""
          echo "📋 Uploaded assets:"
          echo "$RELEASE_INFO" | jq -r '.assets[] | "  - \(.name) (\(.size) bytes)"'
