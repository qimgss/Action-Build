name: Upload Artifacts to Release

on:
  workflow_dispatch:
    inputs:
      workflow_name:
        description: '要上传的工作流名称'
        required: true
        type: string
      include_failed_cancelled:
        description: '是否包含失败/取消的工作流（勾选=包含，不勾选=仅成功）'
        required: false
        default: false
        type: boolean
      artifact_count:
        description: '最近运行的工作流数量（包括失败/取消的）'
        required: false
        default: '1'
        type: string
      branch_name:
        description: '分支名称（可选）'
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  process-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup variables
        id: vars
        run: |
          # 确定分支名
          if [ -n "${{ inputs.branch_name }}" ]; then
            BRANCH="${{ inputs.branch_name }}"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
          fi
          
          # 生成UTC时间
          UTC_TIME=$(TZ=UTC date "+%a %b %d %H:%M:%S UTC %Y")
          RELEASE_NAME="${BRANCH} - ${UTC_TIME}"
          
          echo "release_name=${RELEASE_NAME}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "tag_name=release-$(date +%s)" >> $GITHUB_OUTPUT
          
      - name: Create Release via API
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.vars.outputs.tag_name }}"
          RELEASE_NAME="${{ steps.vars.outputs.release_name }}"
          
          # 创建 Release
          RESPONSE=$(curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{
              \"tag_name\": \"${TAG_NAME}\",
              \"target_commitish\": \"${{ github.sha }}\",
              \"name\": \"${RELEASE_NAME}\",
              \"body\": \"Auto-generated release from workflow ${{ inputs.workflow_name }}\",
              \"draft\": false,
              \"prerelease\": false,
              \"generate_release_notes\": false
            }")
          
          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id')
          echo "release_id=${RELEASE_ID}" >> $GITHUB_OUTPUT
          echo "Created release ID: ${RELEASE_ID}"
          
      - name: Get workflow runs
        id: workflow_runs
        uses: actions/github-script@v7
        with:
          script: |
            const { workflow_name, artifact_count, include_failed_cancelled } = context.payload.inputs;
            const count = parseInt(artifact_count) || 1;
            
            // 查找工作流
            const workflows = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            const targetWorkflow = workflows.data.workflows.find(
              w => w.name === workflow_name
            );
            
            if (!targetWorkflow) {
              core.setFailed(`Workflow "${workflow_name}" not found`);
              return [];
            }
            
            // 构建请求参数
            const params = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: targetWorkflow.id,
              per_page: count
            };
            
            // 如果不包含失败/取消，只获取成功的
            if (include_failed_cancelled !== 'true') {
              params.status = 'success';
            }
            
            // 获取工作流运行记录
            const runs = await github.rest.actions.listWorkflowRuns(params);
            
            const runData = runs.data.workflow_runs.map(run => ({
              id: run.id,
              run_number: run.run_number,
              conclusion: run.conclusion,
              status: run.status,
              created_at: run.created_at
            }));
            
            console.log(`Found ${runData.length} workflow runs`);
            runData.forEach(run => {
              console.log(`  Run #${run.run_number}: ${run.conclusion || run.status}`);
            });
            
            core.setOutput('runs', JSON.stringify(runData));
            return runData;
            
      - name: Download and upload artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.create_release.outputs.release_id }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
        run: |
          RUNS_JSON='${{ steps.workflow_runs.outputs.runs }}'
          RUNS=$(echo "$RUNS_JSON" | jq -c '.[]')
          
          echo "$RUNS" | while read -r RUN; do
            RUN_ID=$(echo "$RUN" | jq -r '.id')
            RUN_NUMBER=$(echo "$RUN" | jq -r '.run_number')
            CONCLUSION=$(echo "$RUN" | jq -r '.conclusion')
            STATUS=$(echo "$RUN" | jq -r '.status')
            
            echo "Processing workflow run #$RUN_NUMBER (ID: $RUN_ID) - Status: $CONCLUSION/$STATUS"
            
            # 获取该运行的artifacts列表
            ARTIFACTS_RESPONSE=$(curl -s \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts")
            
            ARTIFACT_COUNT=$(echo "$ARTIFACTS_RESPONSE" | jq '.total_count')
            echo "  Found $ARTIFACT_COUNT artifacts"
            
            if [ "$ARTIFACT_COUNT" -gt 0 ]; then
              ARTIFACTS=$(echo "$ARTIFACTS_RESPONSE" | jq -c '.artifacts[]')
              
              echo "$ARTIFACTS" | while read -r ARTIFACT; do
                ARTIFACT_ID=$(echo "$ARTIFACT" | jq -r '.id')
                ARTIFACT_NAME=$(echo "$ARTIFACT" | jq -r '.name')
                DOWNLOAD_URL=$(echo "$ARTIFACT" | jq -r '.archive_download_url')
                
                echo "  Downloading artifact: $ARTIFACT_NAME (ID: $ARTIFACT_ID)"
                
                # 下载artifact（注意：需要先重定向获取实际的下载链接）
                LOCATION=$(curl -s -I \
                  -H "Accept: application/vnd.github+json" \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "$DOWNLOAD_URL" | grep -i "^location:" | cut -d' ' -f2 | tr -d '\r\n')
                
                if [ -z "$LOCATION" ]; then
                  # 如果没有重定向，直接下载
                  curl -s -L \
                    -H "Authorization: Bearer $GH_TOKEN" \
                    -o "/tmp/${ARTIFACT_NAME}_run${RUN_NUMBER}.zip" \
                    "$DOWNLOAD_URL"
                else
                  # 使用重定向URL下载
                  curl -s -L \
                    -o "/tmp/${ARTIFACT_NAME}_run${RUN_NUMBER}.zip" \
                    "$LOCATION"
                fi
                
                # 检查文件大小
                FILE_SIZE=$(stat -c%s "/tmp/${ARTIFACT_NAME}_run${RUN_NUMBER}.zip" 2>/dev/null || stat -f%z "/tmp/${ARTIFACT_NAME}_run${RUN_NUMBER}.zip" 2>/dev/null)
                echo "  Downloaded file size: $FILE_SIZE bytes"
                
                if [ "$FILE_SIZE" -gt 0 ]; then
                  # 上传到release
                  ASSET_NAME="${WORKFLOW_NAME}_run${RUN_NUMBER}_${ARTIFACT_NAME}.zip"
                  echo "  Uploading asset: $ASSET_NAME"
                  
                  UPLOAD_RESPONSE=$(curl -s -X POST \
                    -H "Accept: application/vnd.github+json" \
                    -H "Authorization: Bearer $GH_TOKEN" \
                    -H "Content-Type: application/octet-stream" \
                    --data-binary @"/tmp/${ARTIFACT_NAME}_run${RUN_NUMBER}.zip" \
                    "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=${ASSET_NAME}")
                  
                  UPLOAD_STATUS=$(echo "$UPLOAD_RESPONSE" | jq -r '.state // .message // "unknown"')
                  echo "  Upload status: $UPLOAD_STATUS"
                else
                  echo "  Warning: Downloaded file is empty, skipping upload"
                fi
                
                # 清理临时文件
                rm -f "/tmp/${ARTIFACT_NAME}_run${RUN_NUMBER}.zip"
              done
            else
              echo "  No artifacts found for this run"
            fi
          done
          
      - name: Verify release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_ID=${{ steps.create_release.outputs.release_id }}
          
          # 验证release是否创建成功
          RELEASE_INFO=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}")
          
          RELEASE_NAME=$(echo "$RELEASE_INFO" | jq -r '.name')
          ASSETS_COUNT=$(echo "$RELEASE_INFO" | jq '.assets | length')
          
          echo "✅ Release created successfully!"
          echo "📦 Release Name: $RELEASE_NAME"
          echo "🎯 Assets uploaded: $ASSETS_COUNT"
